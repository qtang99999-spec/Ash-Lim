<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ash Lim | 怪核影像煉金術士 × 東西方命盤解碼師</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@600;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #07060b;
      --card-bg: rgba(18, 16, 28, 0.72);
      --card-border: rgba(204, 255, 0, 0.16);
      --card-hover-border: rgba(204, 255, 0, 0.55);
      --accent-green: #ccff00;
      --accent-purple: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-serif: 'Cinzel', 'Noto Serif TC', serif;
      --font-sans: 'Noto Sans TC', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 15% 75%, rgba(204, 255, 0, 0.07) 0%, transparent 40%);
    }

    /* 怪核復古雜訊遮罩 */
    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 導覽列 */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(7, 6, 11, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 2px;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      color: var(--accent-green);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.25s;
    }

    nav a:hover {
      color: var(--accent-green);
    }

    .nav-btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.45rem 1rem;
      border: 1px solid var(--accent-green);
      color: var(--accent-green) !important;
      border-radius: 6px;
      transition: all 0.25s;
    }

    .nav-btn:hover {
      background: var(--accent-green);
      color: #000 !important;
    }

    /* 通用容器 */
    section {
      max-width: 1120px;
      margin: 0 auto;
      padding: 6.5rem 2rem;
    }

    .section-tag {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 2.5px;
      color: var(--accent-green);
      margin-bottom: 0.75rem;
      display: block;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    /* Hero 區塊 */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 3rem;
      padding-top: 8rem;
    }

    .hero-subtitle-top {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-green);
      letter-spacing: 2px;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-subtitle-top::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: 3.6rem;
      line-height: 1.18;
      font-weight: 900;
      margin-bottom: 1.5rem;
    }

    .hero h1 .highlight {
      color: var(--accent-green);
      display: block;
    }

    .hero-slogan {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      line-height: 1.45;
      margin-bottom: 1.2rem;
      color: #e5e7eb;
    }

    .hero-slogan span {
      color: var(--accent-purple);
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 480px;
      margin-bottom: 2.2rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-green), #9ef01a);
      color: #07060b;
      font-weight: 700;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(204, 255, 0, 0.3);
    }

    .btn-secondary {
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--accent-green);
      background: rgba(204, 255, 0, 0.05);
    }

    .hero-keywords {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 3px;
    }

    /* 右側怪核星盤視覺卡片 */
    .oracle-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, rgba(24, 20, 38, 0.9), rgba(10, 9, 18, 0.95));
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(168, 85, 247, 0.12);
    }

    /* 透視網格背景 */
    .oracle-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(204, 255, 0, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(204, 255, 0, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    .card-meta {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .astrolabe-wrapper {
      position: relative;
      z-index: 2;
      width: 240px;
      height: 240px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(204, 255, 0, 0.45);
      border-radius: 50%;
      animation: spinSlow 28s linear infinite;
    }

    .ring-middle {
      position: absolute;
      width: 74%;
      height: 74%;
      border: 1px solid rgba(168, 85, 247, 0.6);
      border-radius: 50%;
      animation: spinReverse 18s linear infinite;
    }

    .ring-middle::before {
      content: "乾 兌 離 震 巽 坎 艮 坤";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: var(--accent-green);
      white-space: nowrap;
    }

    .weird-eye {
      width: 86px;
      height: 52px;
      background: radial-gradient(circle, #ccff00 18%, #a855f7 48%, #120d24 75%);
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      border: 2px solid var(--accent-green);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(204, 255, 0, 0.4);
      position: relative;
    }

    .weird-pupil {
      width: 20px;
      height: 20px;
      background: #07060b;
      border-radius: 50%;
      position: relative;
    }

    .weird-pupil::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* 01 About 區塊 */
    .about-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 2rem;
      margin-top: 2.5rem;
    }

    .bento-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2.5rem;
      transition: border-color 0.3s, transform 0.3s;
    }

    .bento-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-3px);
    }

    .quote-icon {
      font-family: var(--font-serif);
      font-size: 3rem;
      color: var(--accent-green);
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    .quote-text {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      margin-bottom: 1rem;
color: var(--text-main);
}
.about-right p {
color: var(--text-muted);
margin-bottom: 1.2rem;
font-size: 0.96rem;
}
.pill-group {
display: flex;
flex-wrap: wrap;
gap: 0.65rem;
margin-top: 1.5rem;
}
.pill {
font-size: 0.82rem;
padding: 0.35rem 0.9rem;
border-radius: 999px;
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.12);
color: #d1d5db;
}
.expertise-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 1.8rem;
margin-top: 2.5rem;
}
.exp-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 1.5rem;
}
.exp-icon {
width: 44px;
height: 44px;
border-radius: 10px;
background: rgba(204, 255, 0, 0.1);
border: 1px solid rgba(204, 255, 0, 0.3);
display: flex;
align-items: center;
justify-content: center;
color: var(--accent-green);
font-family: var(--font-mono);
font-size: 1.2rem;
}
.exp-num {
font-family: var(--font-mono);
font-size: 0.75rem;
color: var(--text-muted);
letter-spacing: 1.5px;
}
.bento-card h3 {
font-size: 1.3rem;
margin-bottom: 0.6rem;
}
.bento-card p {
color: var(--text-muted);
font-size: 0.94rem;
}
.connect-box {
background: linear-gradient(135deg, rgba(24, 20, 38, 0.9), rgba(14, 12, 22, 0.95));
border: 1px solid var(--card-border);
border-radius: 22px;
padding: 3.5rem;
display: flex;
justify-content: space-between;
align-items: center;
gap: 2rem;
flex-wrap: wrap;
}
.connect-left h2 {
font-family: var(--font-serif);
font-size: 2.2rem;
margin: 0.5rem 0 0.8rem;
}
.connect-left p {
color: var(--text-muted);
}
.connect-right {
text-align: right;
}
.studio-label {
font-family: var(--font-mono);
font-size: 0.75rem;
color: var(--text-muted);
letter-spacing: 2px;
}
.studio-name {
font-size: 1.35rem;
font-weight: 700;
margin: 0.3rem 0 0.2rem;
}
.email-text {
font-family: var(--font-mono);
font-size: 0.88rem;
color: var(--accent-green);
margin-bottom: 1.2rem;
display: block;
}
footer {
max-width: 1120px;
margin: 0 auto;
padding: 2rem;
border-top: 1px solid rgba(255, 255, 255, 0.08);
display: flex;
justify-content: space-between;
font-size: 0.85rem;
color: var(--text-muted);
}
footer a {
color: var(--text-muted);
text-decoration: none;
}
footer a:hover {
color: var(--accent-green);
}
@media (max-width: 860px) {
.hero, .about-grid, .expertise-grid {
grid-template-columns: 1fr;
}
.hero h1 { font-size: 2.6rem; }
.connect-right { text-align: left; }
nav a:not(.nav-btn) { display: none; }
}
